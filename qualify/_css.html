<style>
:root{--paper:#faf9f7;--ink:#1a1d21;--soft:#5b6470;--faint:#8b95a1;--rule:#e2e0dc;--rule2:#c9c5be;--panel:#f3f1ed;--card:#fff;
  --pos:#2f7d54;--neg:#b03a3a;--accent:#2c4a6b;--amber:#c8860d;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --serif:'Newsreader',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-bottom:110px}
a{color:var(--accent);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{padding:48px 0 30px;border-bottom:1px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5vw,54px);line-height:1.08;letter-spacing:-.01em;margin:12px 0 14px;max-width:820px;text-wrap:balance}
.dek{max-width:780px;color:var(--soft);font-size:18.5px;font-family:var(--serif);line-height:1.5}
.dek strong{color:var(--ink);font-weight:600}
.byline{margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
section{padding:44px 0 6px}
.sec-label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h2{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.2;margin-bottom:10px;text-wrap:balance}
h3{font-family:var(--serif);font-size:20px;font-weight:600}
p{margin-bottom:12px}
.lede{color:var(--soft);max-width:780px;margin-bottom:20px}.lede strong,.lede em{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:22px 24px;margin-top:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--rule2);border-radius:3px;background:var(--card);color:var(--soft);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.viz{position:relative}.viz svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:12px var(--mono);padding:6px 8px;border-radius:4px;display:none;white-space:nowrap;z-index:5}
.legend{display:flex;gap:16px;font-size:12px;color:var(--soft);margin:6px 0 0 4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:16px;height:0;border-top:2px solid;display:inline-block}.legend i.dot{width:10px;height:10px;border:0;border-radius:50%}
.verdict{margin-top:16px;padding:2px 0 2px 16px;border-left:3px solid var(--accent);font-size:15px;max-width:780px}
.verdict.sting{border-left-color:var(--neg)}.verdict b{color:var(--accent)}.verdict.sting b{color:var(--neg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:right;padding:0 0 8px;border-bottom:1px solid var(--rule)}
th:first-child{text-align:left}th.l{text-align:left}
td{padding:8px 0;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
td:first-child{text-align:left}td.l{text-align:left}th+th,td+td{padding-left:14px}td.num{white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.sel td{background:var(--panel)}
.tscroll{overflow-x:auto}
#assump-table td:first-child{width:24%}#assump-table td:nth-child(2){width:26%}#assump-table td:nth-child(3){width:14%;white-space:nowrap}#assump-table td:last-child{min-width:240px}
#assump-table .pill{white-space:normal;line-height:1.4}
.note{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.5}
.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amber)}
.hint{font-size:12px;color:var(--faint);line-height:1.45}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule2);border-radius:3px;padding:4px 8px;color:var(--soft);white-space:nowrap}
.pill.bad{color:var(--neg);border-color:var(--neg)}.pill.mid{color:var(--amber);border-color:var(--amber)}.pill.ok{color:var(--pos);border-color:var(--pos)}.pill.acc{color:var(--accent);border-color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;max-width:320px;height:3px;background:var(--rule2);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer;border:2px solid var(--paper)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);cursor:pointer;border:2px solid var(--paper)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 24px;margin-bottom:12px}
.ctl label{display:block}.ctl .hint{margin-bottom:4px}.ctl .val{font-family:var(--mono);font-size:13px;margin-left:8px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:14px}
.stat>div{padding:14px 18px;border-left:1px solid var(--rule)}.stat>div:first-child{border-left:none}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:500}.stat .s{font-size:12px;color:var(--soft);margin-top:4px}
.limits{margin-top:22px;border-left:3px solid var(--neg);padding:2px 0 2px 16px;max-width:780px}.limits p{font-size:14px;color:var(--soft)}
.small{font-size:13.5px;color:var(--soft)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px 24px;font-size:13px;color:var(--soft);margin-top:10px}
.gloss b{color:var(--ink);font-family:var(--mono);font-size:12px;font-weight:500}
.primer{counter-reset:p;max-width:780px}.primer p{padding-left:34px;position:relative;font-size:16.5px}
.primer p::before{counter-increment:p;content:counter(p);position:absolute;left:0;top:2px;font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.quote{border-left:3px solid var(--rule2);padding:2px 0 2px 16px;margin:10px 0;font-family:var(--serif);font-size:17px;color:var(--ink);max-width:780px}
.quote .who{display:block;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.two>div{min-width:0}@media(max-width:700px){.two{grid-template-columns:1fr}}
.score{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}.score b{font-family:var(--mono);font-weight:500;font-size:12px}
.q{font-size:14px;color:var(--ink);padding-left:16px;position:relative;margin-bottom:6px}.q::before{content:"?";position:absolute;left:0;color:var(--accent);font-family:var(--mono)}
canvas.topo{width:100%;image-rendering:pixelated;border:1px solid var(--rule);border-radius:4px;background:#fff}
.tierbox{padding:18px 20px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);margin-top:12px}
.tierbox .t{font-family:var(--serif);font-size:30px;font-weight:600}
.tierbox .t.permanent{color:var(--pos)}.tierbox .t.temporary{color:var(--amber)}.tierbox .t.emergency{color:var(--neg)}.tierbox .t.scrap{color:var(--soft)}
footer{border-top:1px solid var(--rule);margin-top:44px;padding:20px 0 30px;font-family:var(--mono);font-size:12px;color:var(--faint)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* guided tour: spotlight, card beside the element */
#tour{position:absolute;top:0;left:0;right:0;z-index:50;display:none}
#tour.on{display:block}
.tour-hl{position:absolute;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px rgba(26,29,33,.55);transition:all .35s ease;pointer-events:none}
.tour-card{position:absolute;width:min(400px,calc(100vw - 32px));background:var(--card);border:1px solid var(--rule2);border-radius:8px;padding:18px 20px;box-shadow:0 6px 30px rgba(0,0,0,.18)}
.tour-card .tk{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.tour-card p{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 12px}
.tour-nav{display:flex;align-items:center;gap:8px}
.tour-nav .dots{flex:1;display:flex;gap:5px}
.tour-nav .dots i{width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.tour-nav .dots i.on{background:var(--accent)}
.tour-btn{font-family:var(--mono);font-size:12px;padding:7px 14px;border-radius:4px;border:1px solid var(--rule2);background:var(--card);color:var(--soft);cursor:pointer}
.tour-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tour-open{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:4px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.tour-open:hover{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
